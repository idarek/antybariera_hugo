content:
  - name: posts
    label: Wpisy
    # --- IMPORTANT CHANGE HERE ---
    # The path needs to include 'posts/'
    path: 'content/posts/**/index.md'
    # The filename pattern for new posts also needs to include 'posts/'
    filename: 'posts/{year}/{month}/{day}/{fields.slug}/index.md'
    # --- END IMPORTANT CHANGE ---
    type: collection
    view:
      fields: [title, date]
      primary: title
      sort:
        field: date
        order: desc
      search: [title, body]

    fields:
      - name: slug
        label: Slug
        type: string
        description: Unikalna nazwa URL dla tego wpisu (np. moja-izolatka).
        required: true

      - name: title
        label: Tytuł
        type: string
        description: Wprowadź tytuł swojego wpisu.
        required: true

      - name: date
        label: Data publikacji
        type: date
        description: Data publikacji wpisu.
        required: true
        default: '{date}'

      - name: body
        label: Content
        type: rich-text
        description: The main content of your blog post.

      - name: featuredImage
        label: Obrazek wyróżniający
        type: image
        description: An image to represent the post.
        # This 'uploads' path is relative to the *post's* directory
        # so it will correctly go into 'content/posts/YEAR/MONTH/DAY/SLUG/images/'
        uploads: images
        output: images

      - name: postImages
        label: Obrazy wpisu
        type: files
        description: Dodatkowe obrazy do tego wpisu.
        uploads: images
        output: images
        multiple: true

      - name: tags
        label: Tagi
        type: list
        description: Wprowadź tag, naciśnij Enter po każdym tagu.
        field:
          type: string
          label: Tag