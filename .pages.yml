content:
  - name: posts
    label: Wpisy
    # --- IMPORTANT CHANGE HERE ---
    # The path now includes the 'post-slug' as a dynamic segment
    # For discovery, we use the wildcard **
    path: 'content/**/index.md'
    # For new file creation, we define the filename pattern to include the slug
    # We'll use '{fields.slug}' if you add a slug field, or '{fields.title}' for a slug
    filename: '{year}/{month}/{day}/{fields.slug}/index.md' # This is for NEW posts
    # --- END IMPORTANT CHANGE ---

    type: collection
    view:
      fields: [title, date, tags]
      primary: title
      sort:
        field: date
        order: desc
      search: [title, body, tags]

    fields:
      # --- IMPORTANT: ADD A SLUG FIELD ---
      - name: slug
        label: Slug
        type: string
        description: Unikalna nazwa URL dla tego wpisu (np. moja-izolatka).
        required: true
        # It's good practice to auto-generate slug from title
        # Pages CMS doesn't have a direct 'slugify' option for type:string,
        # but you'd typically handle this in your static site generator
        # or by training users to input valid slugs.
        # For creation, the filename pattern will use this field.

      - name: title
        label: Tytuł
        type: string
        description: Wprowadź tytuł swojego wpisu.
        required: true

      - name: date
        label: Data publikacji
        type: date
        description: Data publikacji wpisu.
        required: true
        default: '{date}'

      - name: body
        label: Content
        type: rich-text
        description: The main content of your blog post.

      - name: featuredImage
        label: Obrazek wyróżniający
        type: image
        description: An image to represent the post.
        uploads: images
        output: images

      - name: postImages
        label: Obrazy wpisu
        type: files
        description: Dodatkowe obrazy do tego wpisu.
        uploads: images
        output: images
        multiple: true

      - name: tags
        label: Tagi
        type: list
        description: Wprowadź tag, naciśnij Enter po każdym tagu.
        field:
          type: string
          label: Tag