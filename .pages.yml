content:
  - name: posts
    label: Wpisy
    path: 'content'
    filename: '{year}/{month}/{day}/{fields.slug}/index.md'
    type: collection
    view:
      fields: [title, date]
      primary: title
      sort:
        field: date
        order: desc
      search: [title, body]
      layout: tree
      node:
        filename: index.md
        hideDirs: all

    fields:
      - name: slug
        label: Slug
        type: string
        description: Unikalna nazwa URL dla tego wpisu (np. moja-izolatka).
        required: true
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

      - name: title
        label: Tytuł
        type: string
        description: Wprowadź tytuł swojego wpisu.
        required: true

      - name: date
        label: Data publikacji
        type: date
        description: Data publikacji wpisu.
        required: true
        default: '{date}'

      - name: body
        label: Content
        type: rich-text
        description: The main content of your blog post.

      - name: featuredImage
        label: Obrazek wyróżniający
        type: image
        description: An image to represent the post.
        uploads: images
        output: images

      - name: postImages
        label: Obrazy wpisu
        type: files
        description: Dodatkowe obrazy do tego wpisu.
        uploads: images
        output: images
        multiple: true

      - name: tags
        label: Tagi
        type: list
        description: Wprowadź tag, naciśnij Enter po każdym tagu.
        field:
          type: string
          label: Tag