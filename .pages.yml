media:
  - name: posts-images # A unique name for this media type
    label: Obrazy # Label to display in the CMS menu
    input: content/{year}/{month}/{day}/images # The input path where Pages CMS should look for images
    output: images # How the path should be represented in your content (relative to the post's directory)
    categories: [image] # Categorise as images

content:
  - name: posts
    label: Wpisy
    path: 'content/{year}/{month}/{day}' # The base path for your posts. Pages CMS will infer the year/month/day from the path.
    filename: 'index.md' # The specific file name within that day's folder
    type: collection # Since you'll have multiple posts
    view:
      fields: [title, date] # Fields to display in the list view of posts
      primary: title # The main field to identify posts in the list
      sort:
        field: date
        order: desc # Sort by date, newest first
      search: [title, body] # Allow searching by title and body

    fields:
      - name: title
        label: Tytuł
        type: string
        description: Wprowadź tytuł swojego wpisu.
        required: true # Make this a required field

      - name: date
        label: Data publikacji
        type: date
        description: Data publikacji wpisu.
        required: true
        default: '{date}' # Automatically set to the current date when a new post is created

      - name: body
        label: Content
        type: rich-text # For the main body of your post, allowing rich text editing
        description: The main content of your blog post.

      - name: featuredImage # Example for a single featured image per post
        label: Obrazek wyróżniający
        type: image
        description: An image to represent the post.
        # You'll likely want to set the media source to 'posts-images' specifically for this field
        source: posts-images

      # You might also want to add a field for a list of images related to the post.
      # This would likely involve a 'block' or 'object' type if you want metadata per image.
      # For simplicity, here's a basic 'files' type pointing to the post's images folder:
      - name: postImages
        label: Obrazy wpisu
        type: files # Allows selecting multiple files
        description: Dodatkowe obrazy do tego wpisu.
        source: posts-images # This links to the media entry defined above
        multiple: true # Allows selecting multiple files

      - name: tags # Updated Tags field
        label: Tagi
        type: list # Now a list type
        description: Wprowadź tag, naciśnij Enter po kadym tagu.
        field: # Defines the type of items within the list
          type: string
          label: Tag