baseURL = 'https://antybariera.pl/'
DefaultContentLanguage = "pl"
title = 'AntyBariera Dziennikarska'
pluralizeListTitles = false

[languages]
  [languages.pl]
    contentDir = "content"
    direction = "ltr"
    weight = 1
    locale = "pl-PL"
    label = "Polski"

[outputs]
  page = [ "html"]
  home = [ "html", "rss", "imagessitemap", "json" ]

[outputFormats.imagessitemap]
  baseName  = 'imagessitemap'
  mediaType = 'application/xml'
  noUgly = true # default is false

[imaging]
  resampleFilter = "Lanczos"

[pagination]
  disableAliases = false
  pagerSize = 10
  path = 'strona'

[taxonomies]
  category = 'categories'
  tag = 'tags'

# Link for individual tags
[permalinks]
  tags = "/tag/:slug/"

# Link for all categories and all tags pages
[permalinks.taxonomy]
  categories = "kategorie"
  tags = "tagi"

# Link for individual categories
[permalinks.term]
  categories = "/kategoria/:slug"

[params]
  title_short = "AntyBariera"
  description = 'AntyBariera Dziennikarska Agaty Krokosz'
  search = "/szukaj/"
  og_image = "png/antybariera_og_image.png"
  logo = "svg/antybariera_logo.svg"
  bft = "svg/bft-color.svg"

  [params.author]
    name = 'Agata Krokosz'
    email = 'kontakt@antybariera.pl'

  [params.social]
    facebook = 'antybariera'
    instagram = 'antybariera.pl'

    
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

[privacy]
  [privacy.youtube]
     disable = false
     privacyEnhanced = true