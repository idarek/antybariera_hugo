<script>
  /**
   * Minimal Analytics 4 - Hybrid Detection Loader
   * Prioritises direct tracking; falls back to proxied tracking if blocked.
   */
  (function() {
    // We check a known script URL that ad-blockers always target
    const target = 'https://www.google-analytics.com/analytics.js';

    fetch(target, { 
      mode: 'no-cors', 
      cache: 'no-store',
      // We set a short timeout so we don't wait forever on a slow connection
      signal: AbortSignal.timeout(1500) 
    })
    .then(() => {
      // Not blocked: Load the direct script
      loadScript('/js/success.js');
    })
    .catch(() => {
      // Blocked or Timed Out: Load the masked script
      loadScript('/js/alternate.js');
    });

    function loadScript(src) {
      const s = document.createElement('script');
      s.src = src;
      s.async = true; 
      document.head.appendChild(s);
    }
  })();
</script>
