{{- with resources.Get "js/cookie.js" }}
    {{- if hugo.IsDevelopment }}
      <script src="{{ .RelPermalink }}"></script>
    {{- else }}
      {{- with . | fingerprint | minify }}
        <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
      {{- end }}
    {{- end }}
{{- end }}
