<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Przekierowywanie…</title>
    <meta name="description" content="Trwa automatyczne przenoszenie na nową stronę. Jeśli przekierowanie nie nastąpi samoistnie, skorzystaj z linku podanego w treści.">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
    <script>window.location.href={{ .Permalink | jsonify | safeJS }};</script>
  </head>
  <body aria-live="polite">
    <h1>Przekierowanie...</h1>
    <noscript>
      <p>Ta strona została przeniesiona. Jeśli nie nastąpi automatyczne przekierowanie, <a href="{{ .Permalink }}">kliknij tutaj</a>.</p>
    </noscript>
