{{ define "main" }}

  <section>
  {{ range .Paginator.Pages }}
    <article id="article" class="article">
      <h2 class="entry-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ partial "date.html" . }}
      {{ .Summary | plainify }}
      {{ partial "readmore.html" . }}
    </article>
    <hr class="styled-separator" aria-hidden="true">
  {{ end }}
  </section>

  {{ partial "sections.html" . }}

  {{ partial "pagination.html" . }}

{{ end }}
