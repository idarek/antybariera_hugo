{{ define "main" }}
  <section>
    <article id="article" class="article">
      <h2 class="entry-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ partial "date.html" . }}

      {{ partial "featured-image.html" . }}

      {{ .Content }}
    </article>
  </section>
  {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}

  {{ partial "navigation.html" . }}

{{ end }}
