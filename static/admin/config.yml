site_url: https://antybariera.pl
display_name: AntyBariera CMS
app_title: AntyBariera CMS # <--- Added in v0.141.0
logo:
  src: https://antybariera.pl/svg/antybariera_logo.svg

# Forces all media uploads and filenames to be URL-safe for Hugo
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
  # Uses Agata's local time for {{year}}/{{month}}/{{day}} folders
  timezone: "local"

backend:
  name: github
  repo: idarek/antybariera_hugo
  branch: main
  # Ensures Agata only sees the "Sign in with GitHub" button
  auth_methods: [oauth]
  skip_ci: true
  logout_redirect_url: 'https://antybariera.pl'
  # Custom commit message with the author's name
  commit_messages:
    create: "Dodano wpis: {{slug}} (przez {{author-name}})"
    update: "Aktualizacja wpisu: {{slug}} (przez {{author-name}})"
    delete: "Usunięto wpis: {{slug}} (przez {{author-name}})"
    uploadMedia: "Przesłano plik: {{path}} (przez {{author-name}})"
    deleteMedia: "Usunięto plik: {{path}} (przez {{author-name}})"

publish_mode: editorial_workflow

yaml_formatting:
  indent_sequences: true

local_backend: true

media_folder: "static/images"
public_folder: "/images"

i18n:
  default_locale: pl
  locales:
    - pl

collections:
  - name: "posts"
    label: "Wpisy"
    folder: "content"
    # Allows Agata to clone existing posts
    duplicate: true 
    nested: true
    relative_assets: true
    slug: "{{slug}}"
    extension: "md"
    path: "{{year}}/{{month}}/{{day}}/{{slug}}/index"
    media_folder: "images"
    public_folder: "images"
    media_folder_relative: true
    identifier_field: [ date, title ]
    sortable_fields:
      fields: [ date ]
      default:
        field: date
        direction: descending
    thumbnail: "featuredImage" 
    summary: "{{date}} | {{title}}"
    view_groups:
      groups:
        - name: year
          label: Rok (Year)
          field: date
          pattern: \d{4}
        - name: date
          label: Data
          field: date
          pattern: \d{4}-\d{2}-\d{2}
      default: year
    fields:
      - label: "Autor"
        name: "author"
        widget: "hidden"
        default: "{{author-name}}" 
      - label: "Status wpisu"
        name: "status"
        widget: "select"
        options: 
          - { label: "Szkic (Draft)", value: "draft" }
          - { label: "Do przeglądu (Review)", value: "review" }
          - { label: "Gotowy (Final)", value: "final" }
        default: "draft"
      - label: "Tytuł"
        name: "title"
        widget: "string"
      - label: "Opis SEO (Meta Description)"
        name: "description"
        widget: "text" 
        required: false
        hint: "Krótki opis widoczny w wyszukiwarce Google (zalecane do 255 znaków)."
      - label: "Data"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        # --- NEW in v0.167.0: Prevents timezone mismatches ---
        input_timezone: "local"
        # -----------------------------------------------------
        type: "date"
        min: "2024-01-01" 
        display_format: "D MMMM YYYY"
      - label: "Obrazek wyróżniający"
        name: "featuredImage"
        widget: "image"
        required: false
      - label: "Opis obrazka (SEO/Alt)"
        name: "featuredImageAlt"
        widget: "string"
        required: false
        hint: "Opisz co jest na zdjęciu dla osób niewidomych i wyszukiwarek."
      - label: "Treść"
        name: "body"
        widget: "markdown"
        sanitize_preview: false
        line_numbers: true
        media_library:
          allow_external_urls: false 
          max_file_size: 4194304 
      - label: "Tagi"
        name: "tags"
        widget: "list"
        required: false
        allow_duplicate: false