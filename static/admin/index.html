<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>AntyBariera CMS</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Niestandardowy przycisk YouTube dla Agaty -->
    <script>
      CMS.registerEditorComponent({
        // Wewnętrzne ID komponentu
        id: "youtube",
        // Etykieta, którą Agata zobaczy w menu edytora
        label: "Wideo z YouTube",
        // Formularz, który pojawi się w okienku popup
        fields: [
          {
            name: "url",
            label: "Link do filmu na YouTube",
            widget: "string",
            hint: "Po prostu wklej cały link (np. https://www.youtube.com/watch?v=8vmnxgyr20Q) lub z telefonu (youtu.be/8vmnxgyr20Q). System sam wyciągnie ID!"
          }
        ],
        
        // Jak Sveltia rozpoznaje istniejące shortcode'y w plikach .md
        // Łapie klasyczne {{< youtube 8vmnxgyr20Q >}}
        pattern: /^{{<\s*youtube\s+([a-zA-Z0-9_-]+)\s*>}}$/,
        
        // Jak ładuje stare dane z powrotem do okienka, gdy Agata edytuje wpis
        fromBlock: function(match) {
          return { url: match[1] };
        },
        
        // Co system wpisuje do pliku Markdown, gdy Agata kliknie "Zapisz"
        toBlock: function(obj) {
          let input = obj.url || "";
          let videoId = input.trim();
          
          // Magia: Regex, który wyciąga z dowolnego linku YouTube tylko 11-znakowe ID
          let match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
          
          // Jeśli znaleziono pełny link, użyj wyciętego ID. Jeśli nie, załóż, że wkleiła samo ID.
          if (match && match[1]) {
            videoId = match[1];
          }

          return `{{< youtube ${videoId} >}}`;
        },
        
        // Co Agata widzi po prawej stronie w panelu podglądu na żywo
        toPreview: function(obj) {
          let input = obj.url || "";
          let videoId = input.trim();
          let match = input.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
          
          if (match && match[1]) {
            videoId = match[1];
          }

          if (!videoId) {
            const em = document.createElement('em');
            em.textContent = "Wklej link do YouTube...";
            return em;
          }

          // Pokazuje prawdziwy odtwarzacz wideo z YouTube jako potwierdzenie
          const container = document.createElement('div');
          container.style.cssText = "background:#eee; padding:10px; border-radius:8px; text-align:center;";

          const iframe = document.createElement('iframe');
          iframe.width = "100%";
          iframe.height = "250";
          iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}`;
          iframe.frameBorder = "0";
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.style.borderRadius = "4px";

          const p = document.createElement('p');
          p.style.cssText = "font-family:sans-serif; font-size:12px; color:#555; margin-top:5px;";
          p.textContent = "Grywalny podgląd wideo YouTube";

          container.appendChild(iframe);
          container.appendChild(p);

          return container;
        }
      });
    </script>
  </body>
</html>
