<div class="date">
    <svg width="0.8rem" height="0.8rem" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="5" width="18" height="16" rx="2" stroke="#333333" stroke-width="2"/>
        <path d="M7 3V7" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
        <path d="M17 3V7" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 10H21" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
        <circle cx="8" cy="15" r="1" fill="#333333"/>
        <circle cx="12" cy="15" r="1" fill="#333333"/>
        <circle cx="16" cy="15" r="1" fill="#333333"/>
    </svg>
    <span class="sr-only">Opublikowano</span>
    {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
    {{ $dateHuman := .Date | time.Format  "2 January 2006" }}
    <time datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
</div>
